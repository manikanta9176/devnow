name: Bug report
description: A shared status page did the wrong thing.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The status lives in the link. Use a fake status and a fake URL. Do not paste a real private link.
  - type: dropdown
    id: area
    attributes:
      label: What broke?
      options:
        - The status text
        - The optional link
        - The update time
        - Copying the link
        - Opening a shared link
        - Something else
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Set the status to "Shipping the login fix".
        2. Copy the link.
        3. Open it in a private window.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 131 on macOS
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This report uses a fake status and does not include a real private link.
          required: true
